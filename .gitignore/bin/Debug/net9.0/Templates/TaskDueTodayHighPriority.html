<!DOCTYPE html>
<html lang="en" xmlns="http://www.w3.org/1999/xhtml">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <meta http-equiv="X-UA-Compatible" content="IE=edge"/>
  <title>High Priority Tasks Due Today</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600&family=DM+Serif+Display&display=swap');
    body, table, td, a { -webkit-text-size-adjust: 100%; -ms-text-size-adjust: 100%; }
    table, td            { mso-table-lspace: 0pt; mso-table-rspace: 0pt; }
    img                  { -ms-interpolation-mode: bicubic; border: 0; display: block; }
    body                 { margin: 0; padding: 0; background-color: #F4F1EE; }
  </style>
</head>
<body style="margin:0;padding:0;background-color:#F4F1EE;font-family:'DM Sans',sans-serif;">

  <table width="100%" cellpadding="0" cellspacing="0" border="0" style="background-color:#F4F1EE;padding:40px 0;">
    <tr>
      <td align="center">

        <table width="560" cellpadding="0" cellspacing="0" border="0"
               style="max-width:560px;width:100%;background:#FFFFFF;border-radius:16px;overflow:hidden;
                      box-shadow:0 4px 24px rgba(0,0,0,0.07);">

          <tr>
            <td style="height:5px;background:linear-gradient(90deg,#6C63FF 0%,#A78BFA 100%);"></td>
          </tr>

          <tr>
            <td align="center" style="padding:36px 48px 24px;background:#FFFFFF;">
              <table cellpadding="0" cellspacing="0" border="0">
                <tr>
                  <td align="center">
                    <div style="display:inline-block;background:linear-gradient(135deg,#6C63FF,#A78BFA);
                                border-radius:12px;padding:10px 18px;">
                      <span style="font-family:'DM Serif Display',serif;font-size:20px;
                                   color:#FFFFFF;letter-spacing:0.5px;">AI-genda</span>
                    </div>
                  </td>
                </tr>
              </table>
            </td>
          </tr>

          <tr>
            <td style="padding:0 48px 36px;">

              <p style="margin:0 0 12px;font-size:22px;font-family:'DM Serif Display',serif;
                         color:#1A1035;line-height:1.3;">
                Hi, {{username}} 👋
              </p>

              <p style="margin:0 0 18px;font-size:15px;color:#4B4568;line-height:1.7;">
                You have <strong style="color:#E11D48;">high‑priority tasks</strong> due today.
              </p>

              <!-- Repeat this block for each task -->
              <table width="100%" cellpadding="0" cellspacing="0" border="0"
                     style="background:#F7F5FF;border:1px solid #E5E0FF;border-radius:12px;padding:16px 20px;margin-bottom:12px;">
                <tr>
                  <td style="font-size:13px;color:#9C8FD9;letter-spacing:2px;text-transform:uppercase;">
                    TASK: 
                  </td>
                </tr>
                <tr>
                  <td style="padding-top:8px;font-size:16px;color:#1A1035;font-weight:600;">
                    {{title}}
                  </td>
                </tr>
              </table>
              <!-- /Repeat block -->

            </td>
          </tr>

          <tr>
            <td style="padding:20px 48px 32px;border-top:1px solid #F0EDFF;">
              <p style="margin:0;font-size:12px;color:#C8C2E0;text-align:center;">
                © 2026 AI-genda · All rights reserved
              </p>
            </td>
          </tr>

        </table>

      </td>
    </tr>
  </table>

</body>
</html>
